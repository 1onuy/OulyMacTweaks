name: Build OulyMac Tweaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Debug (test host)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme OulyMacTweaks \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee /tmp/build_debug.log

      - name: Show Swift errors (on failure)
        if: failure()
        run: |
          echo "====== SWIFT COMPILER ERRORS ======"
          grep -E "\.swift:[0-9]+:[0-9]+: error:" /tmp/build_debug.log || echo "(no error lines matched)"
          echo "====== SWIFT COMPILER WARNINGS ======"
          grep -E "\.swift:[0-9]+:[0-9]+: warning:" /tmp/build_debug.log | head -20 || echo "(none)"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -scheme OulyMacTweaks \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
        continue-on-error: true

      - name: Build Release
        run: |
          xcodebuild \
            -scheme OulyMacTweaks \
            -configuration Release \
            -derivedDataPath build/ \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package .app
        run: |
          cp -R "build/Build/Products/Release/OulyMac Tweaks.app" .
          zip -r OulyMacTweaks.zip "OulyMac Tweaks.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OulyMacTweaks-${{ github.sha }}
          path: OulyMacTweaks.zip
          retention-days: 14
